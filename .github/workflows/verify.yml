name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            front/package-lock.json
            data-collector/front/package-lock.json
      - run: python -m pip install -r backend/requirements-server.txt -r data-collector/backend/requirements.txt
      - run: python scripts/check_backend.py
      - run: npm ci && npm run build && npm test
        working-directory: front
      - run: npm ci && npm run build
        working-directory: data-collector/front
      - run: npx playwright install --with-deps chromium
        working-directory: front
      - run: npm run test:e2e
        working-directory: front
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: front/test-results/
